name: Publish to GitHub Packages
on:
  push:
    branches-ignore:
      - 'renovate/**'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'adopt'
          cache: 'maven'
      - name: Publish package
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml --batch-mode deploy
        env:
          USER_NAME: ${{ secrets.VANILLABP_USER_NAME }}
          USER_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
          CAMUNDA_USER_TOKEN: ${{ secrets.CAMUNDA_USER_TOKEN }}
          # Camunda 7 enterprise credentials, consumed by the camunda-enterprise
          # server entry in github-packages-settings.xml.
          CAMUNDA_EE_USR: ${{ secrets.CAMUNDA_EE_USR }}
          CAMUNDA_EE_PSW: ${{ secrets.CAMUNDA_EE_PSW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
