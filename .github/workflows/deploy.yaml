name: Release to Maven Central
# The way every Camunda Community Hub extension releases. Somebody publishes a GitHub
# Release, GitHub creates the tag with it, and the tag name is the version. The hub action
# sets that version, deploys to Camunda's Artifactory first and to Maven Central second,
# using the release profiles of community-hub-release-parent and the org secrets of the
# hub. Then it commits the next development version to 'main'.
#
# This repository has one release line and a literal version, which is the case the action
# was written for. Nothing here runs before a release: the checks of every pull request are
# the gate.
"on":
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the action pushes the tag and the next development version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # the same JDK the checks build with
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC }}
          gpg-passphrase: MAVEN_CENTRAL_GPG_PASSPHRASE
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". Measured on
      # 2026-10-09 with the plugin version of the hub parent, 0.8.0, as well. The runner
      # image ships 3.10 now, so the release brings its own 3.9. The hub action calls the
      # 'mvn' it finds on the PATH, so this step reaches it too. Remove this step once a
      # plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Release
        id: release
        uses: camunda-community-hub/community-action-maven-release@v2
        with:
          release-version: ${{ github.event.release.tag_name }}
          branch: main
          # The action's deploy calls pass -DskipTests, which failsafe 3.6.0 no longer
          # reads. Without -DskipITs both deploys run the integration tests again, so a
          # flaky test could stop the Central half after Artifactory took the release.
          # The checks of every pull request ran them against this commit.
          maven-release-options: -DskipITs
          # The release assets come from the staging directory of the Central deploy. The
          # action's default is the directory of the nexus staging plugin, which this
          # repository turns off (see 'skip.camunda.release' in pom.xml), and the zip of an
          # empty list fails the job after everything was published.
          artifacts-pattern: ./target/central-staging/**/*.jar
          nexus-usr: ${{ secrets.NEXUS_USR }}
          nexus-psw: ${{ secrets.NEXUS_PSW }}
          sonatype-central-portal-usr: ${{ secrets.COMMUNITY_HUB_MAVEN_CENTRAL_CP_USR }}
          sonatype-central-portal-psw: ${{ secrets.COMMUNITY_HUB_MAVEN_CENTRAL_CP_PSW }}
          maven-gpg-passphrase: ${{ secrets.MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE }}
          maven-auto-release-after-close: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the artifacts to the GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.release.outputs.artifacts_archive_path }}
          asset_name: ${{ steps.release.outputs.artifacts_archive_path }}
          asset_content_type: application/zip
