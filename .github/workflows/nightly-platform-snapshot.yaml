name: Nightly against the platform snapshot
# This repository only builds when somebody pushes to it, so a platform snapshot can break
# it and nobody learns of that until the next pull request. On the 26th of September 2026
# the platform published at 12:19, the last build here had run at 10:15, and the break
# surfaced a day and a half later inside somebody's pull request.
#
# So this builds once a night against whatever the platform published since yesterday. It is
# a night and not a run after every platform merge because the cost of a night stays the
# same whatever the platform does: the platform merged eight times on the 27th of September
# 2026, and building all four repositories per merge is hours of CI a day. A night finds a
# break within a day, which would have been soon enough for the case above.
#
# A red night does not stay in the list of runs. nightly-platform-snapshot-issue.yaml opens
# an issue for it, the way the Camunda 8 adapter reports a release line which broke.
"on":
  schedule:
    # GitHub queues a scheduled run rather than starting it at the given time, and the wait
    # can be hours, so what stands here is the earliest this may start and not the hour it
    # runs at. The minute is a crooked one because the queue is longest on the hour.
    #
    # The four nights are at least a quarter of an hour apart so a queue does not start them
    # together, and they follow the Camunda 8 release line matrix, which measures the same
    # snapshot from 00:23: the Camunda 7 adapter at 00:41, the Process-Engine-API adapter at
    # 00:56 and the Hazelcast election cache at 01:11. All four are asked for before the
    # Business Cockpit line matrix at 01:37 and the blueprints nightly at 02:00, which read
    # the same published snapshot, and all four are long done before anybody in Berlin
    # starts pushing.
    - cron: "41 0 * * *"
  # so somebody who merged a fix can measure it now instead of waiting for the night
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a dispatch while the night's run is still going must not build the same thing twice,
  # and the run already going is the one to keep: it is the one the issue workflow waits for
  group: nightly-platform-snapshot
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      # The cache above can hold a platform jar from a day this build never asks for again.
      # The step which names the snapshot reads what is newer than this marker, so it names
      # what Maven fetched tonight and not what the runner happened to keep.
      - name: Mark the moment the build starts
        run: touch "${RUNNER_TEMP}/platform-snapshot-marker"
      # The same command a pull request of this repository runs, so a red night and a red
      # pull request mean the same thing. '--update-snapshots' is the point of the whole
      # workflow: without it Maven keeps yesterday's platform jar out of the cache above and
      # the night proves nothing. It is 'install' and not 'verify' because the Quarkus tests
      # load the modules of this build from the local repository.
      - name: Build and test against the published platform snapshot
        run: mvn --batch-mode --no-transfer-progress --update-snapshots install
        env:
          CI: false
      # A red night has to say what it was built against, otherwise the reader cannot tell a
      # platform break from a break of this repository. '2.0.0-SNAPSHOT' does not say it:
      # the platform publishes under that same string several times a day. The timestamp and
      # the build number do, and they name a platform build which can be read next to the
      # one before it.
      - name: Which platform snapshot this run built against
        if: always()
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/platform-snapshot.md"
          marker="${RUNNER_TEMP}/platform-snapshot-marker"
          snapshots="${HOME}/.m2/repository/io/vanillabp"
          # Maven writes one maven-metadata-<repository id>.xml per remote repository a
          # snapshot came from, next to the jar it resolved. The VanillaBP snapshots come
          # from the repository 'central-snapshots', which io.vanillabp:release-parent
          # names, so this reads what came from the platform and skips what this build
          # installed itself, which carries no such file.
          mapfile -t metadata < <(find "$snapshots" \
            -path '*-SNAPSHOT/maven-metadata-central-snapshots.xml' -newer "$marker" \
            2>/dev/null | sort)
          stale=""
          if [ "${#metadata[@]}" -eq 0 ]; then
            mapfile -t metadata < <(find "$snapshots" \
              -path '*-SNAPSHOT/maven-metadata-central-snapshots.xml' 2>/dev/null | sort)
            stale="Maven refreshed none of these while this run was going, so they are what
          the cache of the runner held and not necessarily what was built against."
          fi
          : > "$out"
          for meta in "${metadata[@]}"; do
            directory=$(dirname "$meta")
            version=$(basename "$directory")
            # the path under the local repository is the group and the artifact, and the
            # artifact alone is not enough: 'core' is the name of several of them
            coordinates=$(dirname "${directory#"${HOME}/.m2/repository/"}")
            group=$(dirname "$coordinates" | tr / .)
            artifact=$(basename "$coordinates")
            timestamp=$(sed -n 's|.*<timestamp>\(.*\)</timestamp>.*|\1|p' "$meta" | head -1)
            build=$(sed -n 's|.*<buildNumber>\(.*\)</buildNumber>.*|\1|p' "$meta" | head -1)
            if [ -n "$timestamp" ] && [ -n "$build" ]; then
              resolved="${version%-SNAPSHOT}-${timestamp}-${build}"
            else
              # a repository which answers without a timestamp still says which version was
              # asked for, and that is better than leaving the artifact out
              resolved="${version}, and $(basename "$meta") holds no timestamp"
            fi
            printf -- '- `%s:%s` %s\n' "$group" "$artifact" "$resolved" >> "$out"
          done
          # the same line several times says nothing twice
          sort -u -o "$out" "$out"
          if [ -n "$stale" ]; then
            printf '\n%s\n' "$stale" >> "$out"
          fi
          if [ ! -s "$out" ]; then
            {
              echo "No platform snapshot was resolved in this run. Either the build did not"
              echo "reach its dependencies, or it could not reach the registry."
            } > "$out"
          fi
          {
            echo "### The platform this run was built against"
            echo
            cat "$out"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$out"
      # so the issue of a red night can name it too, without reading the log
      - name: Hand that to the workflow which writes the issue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-snapshot
          path: "${{ runner.temp }}/platform-snapshot.md"
          retention-days: 30
          if-no-files-found: ignore
      # what a failing test printed is in these reports, and for the Quarkus modules booting
      # their application in a JVM of its own it is only in that application's log file.
      # Surefire prints its last line, which is never the interesting one.
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 30
          if-no-files-found: ignore
