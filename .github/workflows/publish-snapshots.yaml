name: Build and publish snapshots
# A pull request builds and tests, a push to main publishes. Both run as the job
# 'publish', which is the check main requires, so a pull request Renovate opens gets a
# result like every other one - it did not while this workflow only listened to pushes
# and ignored renovate/**, and a required check nobody produces waits forever.
#
# Publishing from main alone is the second half of it: there is one snapshot version per
# module, so every branch used to overwrite what main had published in the registry, and
# whoever pushed last decided what the other repositories compiled against.
#
# The snapshots go to the snapshot repository of Maven Central. Anybody can read them there
# without a login, the build of a pull request from a fork included. Writing needs the
# Central Portal token, and only a push to main gets it.
"on":
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # two pushes to main must not publish at the same time, and the later one has to
  # finish rather than be cancelled: it carries the newer artifacts
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # A pull request builds with it too, so it tests with the Maven that main publishes
      # with. Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
          # the server of the profile 'central-sonatype-publish' in the hub parent. The two
          # names are environment variables, and only the step which publishes sets them
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # 'install' and not 'install verify': install already runs every phase verify
      # has, so naming both made Maven walk two lifecycles per module. The tests
      # skipped their second run, the compiler did not, and every javac warning was
      # reported twice - once per compilation. It stays 'install' because
      # the Quarkus tests load modules from the local repository.
      - name: Build and test
        if: "${{ github.event_name == 'pull_request' }}"
        run: mvn --batch-mode --no-transfer-progress --update-snapshots install
        env:
          CI: false
      # the profile 'central-sonatype-publish' sends a version ending in -SNAPSHOT straight to the
      # snapshot repository of Maven Central
      - name: Publish snapshot
        if: "${{ github.event_name == 'push' }}"
        run: mvn --batch-mode --no-transfer-progress --update-snapshots deploy -P central-sonatype-publish
        env:
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PASSWORD }}"
          CI: false
      # what a failing test printed is in these reports, and for the Quarkus modules
      # booting their application in a forked JVM it is ONLY in that application's own
      # log file. Surefire prints its last line, which is never the interesting one.
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect coverage reports
        if: "${{ github.event_name == 'push' }}"
        run: |
          mkdir -p coverage
          cp -r test-coverage-report/spring-boot/report coverage/spring-boot-report
          cp -r test-coverage-report/quarkus/report coverage/quarkus-report
      - name: Upload coverage report files as artifact
        if: "${{ github.event_name == 'push' }}"
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage
  deploy-coverage-report:
    if: "${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}"
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
