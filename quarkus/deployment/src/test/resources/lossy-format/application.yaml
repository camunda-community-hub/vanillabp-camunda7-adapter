quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:c7-quarkus-lossy-format;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
vanillabp:
  adapters:
    c7:
      type: camunda7
      name-clash-avoidance: by-adapter
      serialization-format: application/json
      engine-plugins:
        spin:
          plugin-class: org.camunda.spin.plugin.impl.SpinProcessEnginePlugin
  prioritized-adapters:
    - c7
  workflow-modules:
    c7-test:
      adapters:
        c7:
          resources-location: classpath:c7-lossy-format/processes
      workflows:
        LossyFormat:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - '*'
