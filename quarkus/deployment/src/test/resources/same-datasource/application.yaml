quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:c7-quarkus-same-ds;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
vanillabp:
  adapters:
    c7:
      type: camunda7
    c7b:
      type: camunda7
  prioritized-adapters:
    - c7
    - c7b
  workflow-modules:
    c7-test:
      adapters:
        c7:
          resources-location: classpath:c7-test/processes
        c7b:
          resources-location: classpath:c7-test/processes
      workflows:
        TestProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - '*'
