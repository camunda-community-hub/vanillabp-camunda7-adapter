quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:c7-e2e;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
vanillabp:
  outbox:
    poll-interval: PT0.5S
    attempt-frequency: PT1S
  adapters:
    c7:
      type: camunda7
      name-clash-avoidance: by-adapter
  prioritized-adapters:
    - c7
  workflow-modules:
    c7-e2e:
      adapters:
        c7:
          resources-location: classpath:c7-e2e/processes
      workflows:
        MixedProcess:
          tasks:
            MX_User:
              implemented-externally: true
        SilentUserTaskProcess:
          tasks:
            SU_Task:
              implemented-externally: true
        TtlProcess:
          tasks:
            TTL_Review:
              implemented-externally: true
            TTL_PayOut:
              implemented-externally: true
          adapters:
            c7:
              message-time-to-live: PT1M
          messages:
            TtlReminder:
              adapters:
                c7:
                  message-time-to-live: PT1S
            TtlUnbuffered:
              adapters:
                c7:
                  message-time-to-live: PT0S
        AggregateChangedProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - '*'
        TaskProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - '*'
        TimerStartProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - '*'
